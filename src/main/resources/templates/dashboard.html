<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Geladeira Mágica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .container-fluid {
            padding-top: 2rem;
        }
        .panel {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .panel-header {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1.main-title {
            font-weight: bold;
            color: #0d6efd;
        }
        .btn-blue {
            background-color: #0d6efd;
            border-color: #0d6efd;
            color: white;
        }
        .btn-blue:hover {
            background-color: #0a58ca;
            border-color: #0a58ca;
        }
        .text-blue {
            color: #0d6efd;
        }
        .alert-blue {
            background-color: #eaf3ff;
            border-color: #c9e2ff;
            color: #0d6efd;
        }
        /* Estilos para a Receita Renderizada */
        #recipe-content {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
        }
        #recipe-content h3 {
            color: #0d6efd;
            border-bottom: 2px solid #eaf3ff;
            padding-bottom: 0.5rem;
            margin-top: 2rem;
            font-weight: bold;
        }
        #recipe-content hr {
            border-top: 2px dashed #0d6efd;
            opacity: 0.2;
            margin: 2rem 0;
        }
        #recipe-content ul, #recipe-content ol {
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }
        #recipe-content blockquote {
            border-left: 4px solid #0d6efd;
            background: #f8f9fa;
            padding: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <h1 class="text-center main-title mb-5">Geladeira Mágica</h1>
    <div class="row">
        <!-- Seção de Ingredientes -->
        <div class="col-lg-5">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="text-blue m-0">Seus Ingredientes</h2>
                    <button type="button" class="btn btn-blue" data-bs-toggle="modal" data-bs-target="#addEditModal">
                        + Adicionar Item
                    </button>
                </div>

                <div th:if="${foodItems.isEmpty()}" class="alert alert-info text-center alert-blue">
                    Nenhum ingrediente cadastrado. Adicione alguns para começar!
                </div>

                <div th:unless="${foodItems.isEmpty()}">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Qtd</th>
                            <th>Validade</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${foodItems}">
                            <td th:text="${item.nome}"></td>
                            <td th:text="${item.categoria}"></td>
                            <td th:text="${item.quantidade}"></td>
                            <td th:text="${item.validade}"></td>
                            <td>
                                <button type="button" class="btn btn-sm btn-primary"
                                        data-bs-toggle="modal" data-bs-target="#addEditModal"
                                        th:data-id="${item.id}"
                                        th:data-nome="${item.nome}"
                                        th:data-categoria="${item.categoria}"
                                        th:data-quantidade="${item.quantidade}"
                                        th:data-validade="${item.validade}">
                                    Editar
                                </button>
                                <a th:href="@{/food/ui/deletar/{id}(id=${item.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja deletar?');">Deletar</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Seção do Gerador de Receitas -->
        <div class="col-lg-7">
            <div class="panel">
                <div class="panel-header">
                    <h2 class="text-blue m-0">Chef IA - Sugestões</h2>
                    <a th:href="@{/food/ui/gerarReceita}" class="btn btn-blue">
                        <span th:if="${recipe == null}">Gerar Receita</span>
                        <span th:unless="${recipe == null}">Nova Receita</span>
                    </a>
                </div>

                <div th:if="${recipe == null}" class="alert alert-info text-center alert-blue">
                    Clique em "Gerar Receita" para ver sugestões de pratos com seus ingredientes.
                </div>

                <div th:if="${recipe != null}">
                    <div id="recipe-content" th:data-raw-recipe="${recipe}">
                        <!-- O conteúdo renderizado entrará aqui via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal para Adicionar/Editar Item -->
<div class="modal fade" id="addEditModal" tabindex="-1" aria-labelledby="addEditModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/food/ui/salvar}" th:object="${foodItemDTO}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title" id="addEditModalLabel">Adicionar Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="itemId" th:field="*{id}">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome:</label>
                        <input type="text" id="nome" th:field="*{nome}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="quantidade" class="form-label">Quantidade:</label>
                        <input type="number" id="quantidade" th:field="*{quantidade}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="categoria" class="form-label">Categoria:</label>
                        <select id="categoria" th:field="*{categoria}" class="form-select" required>
                            <option value="">Selecione a categoria</option>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.name()}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="validade" class="form-label">Validade:</label>
                        <input type="date" id="validade" th:field="*{validade}" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                    <button type="submit" class="btn btn-blue">Salvar Item</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    // Renderização do Markdown na Receita
    const recipeDiv = document.getElementById('recipe-content');
    if (recipeDiv) {
        const rawMarkdown = recipeDiv.getAttribute('data-raw-recipe');
        recipeDiv.innerHTML = marked.parse(rawMarkdown);
    }
    const addEditModal = document.getElementById('addEditModal');
    if (addEditModal) {
        addEditModal.addEventListener('show.bs.modal', event => {
            const button = event.relatedTarget;
            const id = button.getAttribute('data-id');
            const nome = button.getAttribute('data-nome');
            const categoria = button.getAttribute('data-categoria');
            const quantidade = button.getAttribute('data-quantidade');
            const validade = button.getAttribute('data-validade');

            const modalTitle = addEditModal.querySelector('.modal-title');
            const idInput = addEditModal.querySelector('#itemId');
            const nomeInput = addEditModal.querySelector('#nome');
            const categoriaInput = addEditModal.querySelector('#categoria');
            const quantidadeInput = addEditModal.querySelector('#quantidade');
            const validadeInput = addEditModal.querySelector('#validade');

            if (id) {
                modalTitle.textContent = 'Editar Item';
                idInput.value = id;
                nomeInput.value = nome;
                categoriaInput.value = categoria;
                quantidadeInput.value = quantidade;
                validadeInput.value = validade;
            } else {
                modalTitle.textContent = 'Adicionar Item';
                idInput.value = '';
                nomeInput.value = '';
                categoriaInput.value = '';
                quantidadeInput.value = '';
                validadeInput.value = '';
            }
        });
    }
</script>
</body>
</html>
